<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocco's Pizza Menu</title>
<!--
  ROCCO'S FULL MENU BOARDS (George's two TVs)
    menu.html?tv=1   Pizza & Italian: Classics, Slices, Toppings,
                     Specialty Pies, Chef Lucas, Italian Dinners
    menu.html?tv=2   Steaks, Hoagies, Salads, Burgers, Strombolis,
                     Appetizers, Seafood, Kids, Sides
  EVERY item on George's menu is on one of the two screens.

  Left: a rotating feature panel (real cut-out photos, slow push, oven
  glow), with today's special or the soup on a card underneath.
  Right: the full menu, fixed and readable. Menu text never moves.
  One text size per board: if anything overflows, the whole board
  shrinks together.
  Prices: by Sheet ID from the command center (signage.js).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Playfair+Display:ital,wght@1,800;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signage.css">
<style>
  .stage { --fs: 1; }

  /* ---------- feature panel (left) ---------- */
  .hero { position: absolute; left: 0; top: 0; bottom: 0; width: 520px; border-right: 1px solid var(--rule); background: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.05) 40%, rgba(0,0,0,.35)); }
  .hero .logo { left: 22px; top: 4px; width: 210px; }
  .hero .glow { left: -40px; top: 130px; width: 600px; height: 520px; }
  .feat { position: absolute; left: 0; right: 0; top: 0; height: 840px; opacity: 0; transition: opacity 1s ease; }
  .feat.on { opacity: 1; }
  .feat .food { left: 40px; top: 175px; width: 440px; height: 360px; display: flex; align-items: center; justify-content: center; }
  .feat .food img { max-height: 360px; width: auto; max-width: 440px; }
  .feat .copy { position: absolute; left: 44px; right: 36px; top: 560px; }
  .feat .eyebrow { font-size: 17px; letter-spacing: .28em; }
  .feat .feature-title { font-size: 64px; margin-top: 10px; }
  .feat .desc { font-size: 20px; color: var(--ivory-2); margin-top: 10px; font-weight: 500; line-height: 1.3; }
  .feat .big { margin-top: 14px; font-size: 64px; color: var(--tomato); }
  .feat .big small { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass-hi); margin-left: 12px; vertical-align: middle; }
  /* entrance each time a feature comes up */
  .feat .food, .feat .copy > * { opacity: 0; }
  .feat.on .food { animation: fIn 1.4s cubic-bezier(.16,1,.3,1) .1s forwards; }
  .feat.on .food img { animation: push 14s ease-in-out 1.5s infinite alternate; }
  .feat.on .copy > * { animation: fUp .9s ease forwards; }
  .feat.on .copy > :nth-child(2) { animation-delay: .15s; }
  .feat.on .copy > :nth-child(3) { animation-delay: .3s; }
  .feat.on .copy > :nth-child(4) { animation-delay: .55s; }
  @keyframes fIn { from { opacity: 0; transform: translateY(20px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes fUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* Today card at the bottom of the panel */
  .today { position: absolute; left: 30px; right: 30px; bottom: 30px; padding: 18px 22px 18px; background: rgba(244,236,221,.05); border-left: 4px solid var(--tomato); }
  .today .k { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .26em; text-transform: uppercase; color: var(--tomato); }
  .today .t { font-weight: 800; font-size: 26px; line-height: 1.15; margin-top: 6px; }
  .today .t .price { color: var(--tomato); margin-left: 8px; }
  .today .s { font-size: 17px; color: var(--ivory-3); margin-top: 4px; font-weight: 500; }
  .today .phone { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; font-family: "Oswald", sans-serif; letter-spacing: .18em; text-transform: uppercase; font-size: 14px; color: var(--ivory-3); }
  .today .phone b { font-family: "Inter", sans-serif; letter-spacing: 0; font-size: 24px; color: var(--ivory); font-weight: 800; }

  /* ---------- menu (right) ---------- */
  .menu { position: absolute; left: 520px; right: 0; top: 0; bottom: 0; padding: 44px 46px 54px 40px; display: grid; column-gap: 40px; }
  .col { min-height: 0; display: flex; flex-direction: column; gap: calc(30px * var(--fs)); }
  .sec { display: flex; flex-direction: column; min-height: 0; }
  .sec.grow { flex: 1; }
  .sec .section-title { font-size: calc(27px * var(--fs)); letter-spacing: .15em; gap: 14px; }
  .sec .by { font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: calc(14px * var(--fs)); color: var(--brass-hi); margin-top: 6px; }
  .sec .meta { font-size: calc(16px * var(--fs)); color: var(--ivory-3); margin-top: 6px; line-height: 1.3; font-weight: 500; }
  .rows { margin-top: calc(14px * var(--fs)); display: flex; flex-direction: column; gap: calc(10px * var(--fs)); }
  .sec.grow .rows { flex: 1; justify-content: space-between; }
  .stage.fitting .sec.grow, .stage.fitting .sec.grow .rows { flex: none; }
  .row { display: grid; grid-template-columns: minmax(0,1fr) auto; column-gap: 12px; align-items: baseline; }
  .row .n { font-weight: 700; font-size: calc(24px * var(--fs)); line-height: 1.12; letter-spacing: -.005em; }
  .row .n .star { color: var(--tomato); font-size: .72em; margin-right: 6px; position: relative; top: -.12em; }
  .row .price { font-size: calc(24px * var(--fs)); text-align: right; }
  .row .d { grid-column: 1 / -1; font-weight: 500; font-size: calc(15.5px * var(--fs)); line-height: 1.25; color: var(--ivory-3); margin-top: 2px; }
  .row.sub .n { font-weight: 600; color: var(--ivory-2); padding-left: 14px; }
  .row.note .n, .row.note .price { font-size: calc(17px * var(--fs)); font-weight: 600; color: var(--ivory-3); }
  .row.hot .n { color: #fff; } .row.hot .price { color: var(--tomato); }
  .row .lbl { font-family: "Oswald", sans-serif; font-weight: 500; font-size: .6em; letter-spacing: .14em; color: var(--brass); margin: 0 4px 0 10px; text-transform: uppercase; }
  .row .lbl:first-child { margin-left: 0; }
  .row.wide .price { grid-column: 1 / -1; text-align: left; margin-top: 2px; }
  .row.glow .price { animation: pglow 2.4s ease 3; }
  @keyframes pglow { 50% { color: #fff; text-shadow: 0 0 18px var(--tomato); } }

  /* Price table (Classics): MED / LG columns */
  .tbl .head { display: grid; grid-template-columns: minmax(0,1fr) calc(76px * var(--fs)) calc(76px * var(--fs)); margin-top: calc(10px * var(--fs)); }
  .tbl .head span { font-family: "Oswald", sans-serif; font-weight: 500; font-size: calc(15px * var(--fs)); letter-spacing: .22em; color: var(--brass); text-align: right; }
  .tbl .rows { margin-top: calc(6px * var(--fs)); }
  .tbl .row { grid-template-columns: minmax(0,1fr) calc(76px * var(--fs)) calc(76px * var(--fs)); }
  .tbl .row .price.one { grid-column: 2 / 4; }
  .tbl .row .d { grid-column: 1 / -1; }

  .tops { margin-top: calc(10px * var(--fs)); font-size: calc(17px * var(--fs)); line-height: 1.4; color: var(--ivory-2); font-weight: 500; }
  .tops b { color: var(--ivory); font-weight: 800; }
  .tops .sep { color: var(--tomato); margin: 0 6px; }

  .flavors { margin-top: calc(10px * var(--fs)); display: flex; flex-wrap: wrap; gap: calc(4px * var(--fs)) calc(16px * var(--fs)); font-weight: 600; font-size: calc(20px * var(--fs)); }
  .flavors span { white-space: nowrap; }
  .flavors span::before { content: "\2022"; color: var(--tomato); margin-right: 6px; }
  .sizes { display: flex; flex-wrap: wrap; gap: calc(4px * var(--fs)) calc(16px * var(--fs)); margin-top: calc(10px * var(--fs)); }
  .sizes span { font-family: "Inter", sans-serif; font-weight: 800; font-size: calc(24px * var(--fs)); white-space: nowrap; }
  .sizes em { font-style: normal; font-family: "Oswald", sans-serif; font-weight: 500; font-size: .6em; letter-spacing: .18em; color: var(--brass); margin-right: 6px; text-transform: uppercase; }
</style>

  /* ---------- prices ---------- */
  function sizesHtml(str) {
    const map = { S: "Sm", M: "Med", L: "Lg", Med: "Med", Large: "Lg", Sicilian: "Sic" };
    return String(str).split("/").map(part => {
      const m = part.trim().match(/^([A-Za-z]+)\s+(.*)$/);
      return m ? '<span class="lbl">' + esc(map[m[1]] || m[1]) + '</span>' + RS.money(m[2]) : RS.money(part.trim());
    }).join("");
  }
  function priceHtml(it) {
    if (it.np || !it.ids.length) return "";
    const list = it.ids.map(id => RS.price(id)).filter(Boolean);
    if (!list.length) return "";
    if (list.length > 1 && !list.every(x => x === list[0])) return list.map(RS.money).join(" / ");
    return /\//.test(list[0]) ? sizesHtml(list[0]) : RS.money(list[0]);
  }

  /* ---------- sections ---------- */
  function rowHtml(it) {
    const raw = it.ids.map(id => RS.price(id)).join("|");
    const wide = /\//.test(raw) && it.ids.length === 1;
    return '<div class="row' + (it.sub ? ' sub' : '') + (it.note ? ' note' : '') + (it.hot ? ' hot' : '') + (wide ? ' wide' : '') + '" data-ids="' + it.ids.join(",") + '">' +

      '<div class="price">' + priceHtml(it) + '</div>' +
      (it.d ? '<div class="d">' + esc(it.d) + '</div>' : '') + '</div>';
  }
  function tblRow(it) {
    const cells = it.ids.length === 2
      ? '<div class="price">' + RS.p(it.ids[0]) + '</div><div class="price">' + RS.p(it.ids[1]) + '</div>'
      : '<div class="price one">' + RS.p(it.ids[0]) + '</div>';
    return '<div class="row" data-ids="' + it.ids.join(",") + '"><div class="n">' + esc(it.n) + '</div>' + cells +
      (it.d ? '<div class="d">' + esc(it.d) + '</div>' : '') + '</div>';
  }

    let body = "";

      body = '<div class="tbl"><div class="head"><span></span>' + sec.head.map(h => '<span>' + esc(h) + '</span>').join("") + '</div>' +
        '<div class="rows">' + sec.items.map(tblRow).join("") + '</div></div>';
    } else if (sec.type === "tops") {
      const med = RS.size("R010", "Med"), lg = RS.size("R010", "Large"), sic = RS.price("R012").replace(/\s*each/i, "");
      const extra = RS.price("R013").replace(/\s*extra/i, "");
      body = '<div class="tops"><b>Med ' + RS.money(med) + '</b><span class="sep">•</span><b>Lg ' + RS.money(lg) + '</b><span class="sep">•</span><b>Sicilian ' + RS.money(sic) + '</b><br>' +
        'Mushrooms, pepperoni, sausage, meatballs, ground beef, salami, anchovies, black olives, fresh tomato, extra cheese' +
        (extra ? '<br><b>Bacon, broccoli or spinach ' + RS.money(extra) + '</b>' : '') + '</div>';
    } else if (sec.type === "inline") {
      const sizeStr = RS.price(sec.sizes);
      body = '<div class="sizes">' + sizeStr.split("/").map(part => {
          const m = part.trim().match(/^([A-Za-z]+)\s+(.*)$/);
          const label = m ? ({ S: "Sm", M: "Med", L: "Lg" }[m[1]] || m[1]) : "";
          return '<span>' + (m ? '<em>' + esc(label) + '</em>' + RS.money(m[2]) : RS.money(part)) + '</span>';
        }).join("") + '</div>' +
        '<div class="flavors">' + sec.items.map(it => {
          const own = it.ids.map(id => RS.price(id)).join("|");
          return '<span>' + esc(it.n) + (own && own !== sizeStr ? ' ' + priceHtml(it) : '') + '</span>';
        }).join("") + '</div>';
    } else {
      body = '<div class="rows">' + sec.items.map(rowHtml).join("") + '</div>';
    }
    return '<section class="sec' + (sec.grow ? ' grow' : '') + '">' +
      '<div class="section-title">' + esc(sec.h) + '</div>' +
      (sec.by ? '<div class="by">' + esc(sec.by) + '</div>' : '') +
      (sec.meta ? '<div class="meta">' + esc(sec.meta) + '</div>' : '') + body + '</section>';
  }

  function drawMenu() {
    const menu = document.getElementById("menu");
    menu.style.gridTemplateColumns = B.cols;
    menu.innerHTML = B.columns.map(c => '<div class="col">' + c.map(secHtml).join("") + '</div>').join("");
    fit();
  }

  /* One text size for the whole board. */
  function fit() {
    const stage = document.getElementById("stage");
    const over = () => [...document.querySelectorAll(".menu .col")].some(c => c.scrollHeight > c.clientHeight + 1) ||
      [...document.querySelectorAll(".menu .row")].some(r => r.scrollWidth > r.clientWidth + 1);
    let fs = 1;
    stage.classList.add("fitting");
    stage.style.setProperty("--fs", fs);
    while (over() && fs > 0.6) { fs = Math.round((fs - 0.02) * 100) / 100; stage.style.setProperty("--fs", fs); }
    stage.classList.remove("fitting");
    stage.dataset.fs = fs;
  }

  /* ---------- feature panel ---------- */
  let built = false, cur = 0;
  function todayCard() {
    if (tv === 2) {
      const soups = (RS.settings.soupList && RS.settings.soupList.length) ? RS.settings.soupList.map(s => s.name)
        : (RS.settings.soup ? [RS.settings.soup] : []);
      const banner = RS.settings.banner;
      let html = "";
      if (soups.length) html += '<div class="k">' + (soups.length > 1 ? "Soups of the Day" : "Soup of the Day") + '</div><div class="t">' + soups.map(esc).join(" &amp; ") + '<span class="price">' + RS.p("R099") + '</span></div>';
      else html += '<div class="k">Proudly Featuring</div><div class="t">Boar’s Head meats &amp; cheeses</div>';
      if (banner) html += '<div class="s" style="color:var(--ivory)">' + esc(banner) + '</div>';
      return html;
    }
    const day = RS.weekday();
    const todays = DAILY[day];
    if (todays) return '<div class="k">Today’s Special</div>' + todays.map(t => '<div class="t">' + esc(t[1]) + '<span class="price">' + RS.p(t[0]) + '</span></div><div class="s">' + esc(t[2]) + '</div>').join("");
    if (day === 4) return '<div class="k">Pickup Deal · Mon–Thu</div><div class="t">2 Large Cheese<span class="price">' + RS.p("R005") + '</span></div><div class="s">2 Jersey Shore ' + RS.money(RS.price("R006")) + ' · Tomato Pie ' + RS.money(RS.price("R007")) + '</div>';
    return '<div class="k">Gluten Free</div><div class="t">10″ Gluten Free Pizza<span class="price">' + RS.p("R017") + '</span></div><div class="s">All pasta dishes available gluten free</div>';
  }
  function drawHero() {
    const hero = document.getElementById("hero");
    if (!built) {
      hero.insertAdjacentHTML("beforeend",
        B.features.map(f =>
          '<div class="feat"><div class="food"><img src="' + f.img + '" alt=""></div>' +
          '<div class="copy"><div class="eyebrow">' + esc(f.eyebrow) + '</div><div class="feature-title">' + esc(f.title) + '</div>' +
          '<div class="desc">' + esc(f.desc) + '</div><div class="big price"></div></div></div>').join("") +
        '<div class="logo"><img src="' + LOGO + '" alt="Rocco’s Pizza"></div><div class="today" id="today"></div>');
      built = true;
      hero.querySelector(".feat").classList.add("on");
      setInterval(() => {
        const feats = hero.querySelectorAll(".feat");
        feats[cur].classList.remove("on");
        cur = (cur + 1) % feats.length;
        void feats[cur].offsetWidth;
        feats[cur].classList.add("on");
      }, FEATURE_SECONDS * 1000);
    }
    hero.querySelectorAll(".feat").forEach((el, i) => {
      const f = B.features[i];
      el.querySelector(".big").innerHTML = RS.p(f.id) + (f.label ? '<small>' + esc(f.label) + '</small>' : '');
      // Long titles shrink to fit the panel
      const t = el.querySelector(".feature-title"); let size = 64; t.style.fontSize = size + "px";
      while (t.scrollWidth > t.clientWidth && size > 40) { size -= 2; t.style.fontSize = size + "px"; }
    });
    const today = document.getElementById("today");
    today.innerHTML = todayCard() + '<div class="phone">Pickup &amp; Delivery<b>610-935-2202</b></div>';
  }

  let lastPrices = null;
  RS.start(function () {
    const prev = lastPrices;
    lastPrices = Object.assign({}, RS.prices);
    drawMenu();
    drawHero();
    if (prev) Object.keys(RS.prices).filter(id => RS.prices[id] !== prev[id]).forEach(id =>
      document.querySelectorAll('.row[data-ids*="' + id + '"]').forEach(el => el.classList.add("glow")));
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  // Midnight: today's special changes
  setInterval(drawHero, 30 * 60 * 1000);
})();
</script>
</body>
</html>
