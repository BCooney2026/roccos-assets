<title>Rocco's Pizza Menu Board</title>
<!--
  ROCCO'S MENU BOARDS (two 50" TVs at the shop)
  ------------------------------------------------------------------
  One file, two boards:
    ?tv=1   Pizza & Italian: hero (Jersey Shore), Pizza, Chef Lucas,
            Italian Dinners
    ?tv=2   Steaks & Sandwiches: logo + Soup of the Day hero, Steaks &
            Subs, Boar's Head Hoagies, Salads, Burgers, Strombolis,
            Appetizers, Seafood, Sides, Kids

  Design rules (national chain style):
    - one hero photo per screen, everything else is a clean list
    - one type family (Archivo), strict grid, no frames or textures
    - prices without "$", cents raised small (16 95)
    - brand red only as an accent

  PRICES come from the command center feed (same as the website), by
  Sheet ID (R001 to R148). George changes a price on the tablet and the
  TVs follow within a few minutes; a changed price glows briefly.
  The typed prices below are only a fallback for a first load with no
  internet. Never edit prices here; edit BOARDS to change what shows.

  The page draws on a fixed 1920x1080 stage scaled to the TV, refreshes
  the feed every 2 minutes, keeps the last good copy if Wi-Fi drops,
  reloads itself at 4 am, drifts a few pixels every 10 minutes and
  slowly zooms the hero photo (both against burn-in), and uses one text
  size per board (shrinks everything together if anything overflows).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0d0c;
    --ink: #f6f1e9;
    --ink-2: rgba(246,241,233,.62);
    --ink-3: rgba(246,241,233,.38);
    --rule: rgba(246,241,233,.12);
    --red: #d6262c;
    --red-deep: #9e1419;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }

  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; overflow: hidden;
    transform-origin: center center;
    background:
      radial-gradient(1400px 700px at 100% 0%, rgba(214,38,44,.07), transparent 60%),
      radial-gradient(900px 600px at 0% 100%, rgba(255,140,60,.05), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "Archivo Narrow", "Arial Narrow", sans-serif;
    display: grid; grid-template-rows: 1fr 72px;
    transition: margin .8s ease;
    --fs: 1;
  }
  .main { min-height: 0; display: grid; gap: 0; padding: 40px 48px 30px 0; }

  /* ---------- hero column ---------- */
  .hero { position: relative; min-height: 0; margin: -40px 48px -30px 0; overflow: hidden; display: flex; flex-direction: column; }
  .hero .pic { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .hero .pic i {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    animation: zoom 60s ease-in-out infinite alternate;
  }
  .hero .pic.split { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .hero .pic.split > div { position: relative; overflow: hidden; }
  @keyframes zoom { from { transform: scale(1.04); } to { transform: scale(1.16) translate(-1.5%, -1%); } }
  .hero .pic::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(14,13,12,.55) 0%, rgba(14,13,12,.05) 22%, rgba(14,13,12,.45) 45%, rgba(14,13,12,.9) 70%, var(--bg) 100%);
  }
  /* Logo PNG has transparent padding; negative margins trim it */
  .hero .logo { position: absolute; z-index: 2; top: 0; left: 0; width: 300px; margin: -14px 0 0 0; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }
  .hero .over { position: absolute; z-index: 2; left: 48px; right: 40px; bottom: 34px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Archivo", sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
    color: #fff; background: var(--red); padding: 8px 14px 8px 12px;
  }
  .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
  .hero h1 {
    font-family: "Archivo", sans-serif; font-weight: 900; font-size: 76px; line-height: .92; letter-spacing: -.035em;
    margin-top: 16px; text-wrap: balance; text-shadow: 0 4px 28px rgba(0,0,0,.7);
  }
  .hero .heroPrice { display: flex; align-items: flex-end; gap: 18px; margin-top: 16px; }
  .hero .heroPrice .p { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 92px; line-height: .8; letter-spacing: -.04em; }
  .hero .heroPrice .p sup { font-size: .42em; vertical-align: top; position: relative; top: .06em; margin-left: 2px; letter-spacing: 0; }
  .hero .heroPrice .note { font-size: 22px; line-height: 1.2; color: var(--ink-2); padding-bottom: 4px; max-width: 300px; }

  /* Today / promo cards under the hero photo */
  .cards { flex: none; padding: 0 28px 28px 40px; display: grid; gap: 12px; }
  .card {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px;
    padding: 16px 20px; background: rgba(246,241,233,.05); border-left: 4px solid var(--red);
  }
  .card .k { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--red); writing-mode: horizontal-tb; }
  .card .t { font-weight: 700; font-size: 25px; line-height: 1.1; }
  .card .t small { display: block; font-weight: 500; font-size: 18px; color: var(--ink-2); margin-top: 3px; }
  .card .pr { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -.03em; }
  .card .pr sup { font-size: .45em; vertical-align: top; position: relative; top: .1em; }

  /* ---------- list columns ---------- */
  .col { min-height: 0; display: flex; flex-direction: column; gap: calc(30px * var(--fs)); padding: 0 34px; border-left: 1px solid var(--rule); }
  .col:first-of-type { border-left: none; }
  .sec { display: flex; flex-direction: column; min-height: 0; }
  .sec.grow { flex: 1; }
  .sec h2 {
    font-family: "Archivo", sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: calc(40px * var(--fs)); line-height: .95; letter-spacing: -.01em;
    border-left: 6px solid var(--red); padding-left: 12px;
  }
  .sec .by {
    font-family: "Archivo", sans-serif; font-weight: 700; font-size: calc(14px * var(--fs));
    letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 0 18px;
  }
  .sec .meta { font-size: calc(18px * var(--fs)); color: var(--ink-2); margin: 8px 0 0 18px; line-height: 1.25; }
  .sec .sizes {
    display: flex; gap: 22px; margin: 12px 0 0 18px; font-family: "Archivo", sans-serif; font-weight: 800;
    font-size: calc(26px * var(--fs)); letter-spacing: -.02em;
  }
  .sec .sizes em { font-style: normal; font-family: "Archivo Narrow", sans-serif; font-weight: 600; color: var(--ink-3); font-size: .62em; letter-spacing: .12em; text-transform: uppercase; margin-right: 6px; }
  .sec .sizes sup { font-size: .5em; vertical-align: top; position: relative; top: .1em; }

  .list { margin-top: calc(14px * var(--fs)); display: flex; flex-direction: column; gap: calc(9px * var(--fs)); }
  .sec.grow .list { flex: 1; justify-content: space-between; }
  /* While measuring, lists hug their content so overflow is real */
  #stage.fitting .sec.grow, #stage.fitting .sec.grow .list { flex: none; }
  /* One line of flavors when they all cost the same (Strombolis) */
  .flavors { display: flex; flex-wrap: wrap; column-gap: 20px; row-gap: 2px; margin: calc(12px * var(--fs)) 0 0 18px; white-space: normal; font-weight: 600; font-size: calc(24px * var(--fs)); line-height: 1.4; color: var(--ink); }
  .flavors span { white-space: nowrap; }
  .flavors span::before { content: "\2022"; color: var(--red); margin-right: 7px; }
  .list.two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; row-gap: calc(9px * var(--fs)); }
  .row { display: grid; grid-template-columns: 1fr auto; column-gap: 14px; align-items: baseline; padding-left: 18px; }
  .row .n { font-weight: 600; font-size: calc(27px * var(--fs)); line-height: 1.1; color: var(--ink); }
  .row .n .star { color: var(--red); font-size: .7em; margin-right: 6px; position: relative; top: -.1em; }
  .row .d { grid-column: 1 / -1; font-weight: 500; font-size: calc(17px * var(--fs)); line-height: 1.2; color: var(--ink-3); margin-top: 1px; }
  .row .p {
    font-family: "Archivo", sans-serif; font-weight: 700; font-size: calc(27px * var(--fs)); letter-spacing: -.02em;
    white-space: nowrap; text-align: right; color: var(--ink);
  }
  .row .p sup { font-size: .52em; vertical-align: top; position: relative; top: .08em; margin-left: 1px; letter-spacing: 0; }
  .row .p .lbl { font-family: "Archivo Narrow", sans-serif; font-weight: 600; font-size: .6em; color: var(--ink-3); letter-spacing: .08em; margin: 0 4px 0 12px; text-transform: uppercase; }
  .row .p .lbl:first-child { margin-left: 0; }
  .row.wide .p { grid-column: 1 / -1; text-align: left; margin-top: 2px; }
  /* Fewer, richer items (Chef Lucas): bigger type instead of big gaps */
  .sec.big .row .n { font-size: calc(32px * var(--fs)); font-weight: 700; }
  .sec.big .row .p { font-size: calc(32px * var(--fs)); }
  .sec.big .row .d { font-size: calc(20px * var(--fs)); margin-top: 3px; }
  .cards .sec { margin-top: 10px; }
  .row.sub .n { color: var(--ink-2); font-weight: 500; }
  .row.feature .n { font-weight: 700; }
  .row.glow .p { animation: glow 2.4s ease 3; }
  @keyframes glow { 0%,100% { color: var(--ink); text-shadow: none; } 50% { color: #fff; text-shadow: 0 0 18px var(--red); } }

  /* ---------- footer ---------- */
  .foot {
    display: flex; align-items: center; gap: 28px; padding: 0 48px; overflow: hidden; white-space: nowrap;
    background: #000; border-top: 1px solid var(--rule);
  }
  .foot .tag { flex: none; font-family: "Archivo", sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; background: var(--red); color: #fff; padding: 9px 14px; }
  .foot .run { flex: 1; min-width: 0; overflow: hidden; font-weight: 600; font-size: 26px; }
  .foot .run .inner { display: inline-block; }
  .foot .run.scroll .inner { padding-left: 100%; animation: ticker var(--dur, 30s) linear infinite; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  .foot .run b { font-family: "Archivo", sans-serif; font-weight: 800; margin-left: 8px; }
  .foot .run b sup { font-size: .55em; vertical-align: top; position: relative; top: .08em; }
  .foot .run i { font-style: normal; color: var(--ink-3); margin: 0 18px; }
  .foot .run .alert { color: #fff; }
  .foot .brand { flex: none; display: flex; align-items: center; gap: 22px; font-family: "Archivo", sans-serif; font-weight: 700; font-size: 22px; color: var(--ink-2); }
  .foot .brand b { color: var(--ink); font-weight: 800; letter-spacing: .02em; }
  .foot .brand span { width: 1px; height: 26px; background: var(--rule); }
</style>

            { n: "Add cheese, peppers, mushrooms, bacon", ids: ["R078"], sub: 1 }
          ]},
          { h: "Salads", items: [
            { n: "Antipasti", ids: ["R089"] },
            { n: "Chef Salad", ids: ["R093"], s: 1 },
            { n: "Greek w/ Shrimp or Chicken", ids: ["R096"], s: 1 },
            { n: "Grilled Chicken Caesar", ids: ["R094"] },
            { n: "Tuna Salad", ids: ["R092"] },
            { n: "Tossed Salad", ids: ["R090"] },
            { n: "Dinner Salad", ids: ["R091"] }
          ]}
        ],
        [
          { h: "Burgers", items: [
            { n: "Hamburger", ids: ["R102"] },
            { n: "Cheeseburger", ids: ["R103"] },
            { n: "Pizza Burger", ids: ["R104"] },
            { n: "California Cheeseburger", ids: ["R105"] },
            { n: "Hawaiian Cheeseburger", ids: ["R107"] },
            { n: "Texas Burger", ids: ["R106"], d: "Cheddar, bacon, BBQ & an onion ring" }
          ]},
          { h: "Strombolis", sizes: "R033", inline: 1, items: [
            { n: "Classic", ids: ["R033"] }, { n: "Vegetarian", ids: ["R034"] },
            { n: "Steak", ids: ["R037"] }, { n: "Chicken", ids: ["R038"] },
            { n: "Bacon", ids: ["R035"] }, { n: "Pepperoni", ids: ["R036"] },
            { n: "Sausage & Pepperoni", ids: ["R039"] }, { n: "Ham Calzone", ids: ["R040"] }
          ]},
          { h: "Kids", items: [
            { n: "Grilled Cheese", ids: ["R145"] },
            { n: "Mac ’n’ Cheese", ids: ["R146"] },
            { n: "Spaghetti & Meatball", ids: ["R143"] },
            { n: "Chicken Fingers & Fries", ids: ["R144"] }
          ]},
          { h: "Sides", items: [
            { n: "Meatballs or Sausage", ids: ["R141"] },
            { n: "Homemade Pasta", ids: ["R142"] }
          ]}

        ]
      ],
      // Small sections under the soup hero (TV 2 left column)
      side: [
        { h: "Seafood", meta: "With French fries", items: [
          { n: "Fried Clams", ids: ["R101"] },
          { n: "7 Jumbo Shrimp", ids: ["R100"] }
        ]},
        { h: "Appetizers", two: 1, items: [
          { n: "French Fries", ids: ["R080"] }, { n: "Gravy Fries", ids: ["R079"] },
          { n: "Cheese Fries", ids: ["R081"] }, { n: "Onion Rings", ids: ["R082"] },
          { n: "Mozz Sticks", ids: ["R087"] }, { n: "Mushrooms", ids: ["R086"] },
          { n: "Wings", ids: ["R088"] }, { n: "Pepperoni Stick", ids: ["R083"] },
          { n: "Garlic Bread", ids: ["R084"] }, { n: "w/ Cheese", ids: ["R085"] }
          ]}
      ]
    }
  };

  /* ---------- state ---------- */
  const tv = String(new URLSearchParams(location.search).get("tv") || "1") === "2" ? 2 : 1;
  let prices = Object.assign({}, FALLBACK);
  let settings = { soup: "", banner: "", soupList: [] };
  let lastPrices = null;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  /** "$16.95" -> 16<sup>95</sup>; "$19.00" -> 19; works inside longer strings. */
  function money(str) {
    return esc(str).replace(/\$?(\d+)\.(\d{2})/g, (m, d, c) => c === "00" ? d : d + "<sup>" + c + "</sup>");
  }
  /** Multi-size price: "Med $17.75 / Large $19.75" -> small labels + prices. */
  function sizes(str) {
    const map = { S: "Sm", M: "Med", L: "Lg", Med: "Med", Large: "Lg", Sicilian: "Sic", Small: "Sm", Medium: "Med" };
    return String(str).split("/").map(part => {
      const m = part.trim().match(/^([A-Za-z]+)\s+(.*)$/);
      return m ? '<span class="lbl">' + esc(map[m[1]] || m[1]) + '</span>' + money(m[2]) : money(part.trim());
    }).join("");
  }
  function priceHtml(it) {
    if (it.np || !it.ids.length) return "";
    if (it.labels) {
      return it.ids.map((id, i) => '<span class="lbl">' + esc(it.labels[i]) + '</span>' + money(prices[id] || "")).join("");
    }
    const list = it.ids.map(id => prices[id]).filter(Boolean);
    if (!list.length) return "";
    if (list.length > 1 && !list.every(p => p === list[0])) return list.map(money).join(" / ");
    const p = list[0];
    return /\//.test(p) ? sizes(p) : money(p);
  }
  function weekday() {
    const d = new Date().toLocaleDateString("en-US", { timeZone: TZ, weekday: "short" });
    return { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[d] || 1;
  }

  /* ---------- sections ---------- */
  function rowHtml(it, hideIfEqual) {
    const p = priceHtml(it);
    const raw = it.ids.map(id => prices[id]).join("|");
    const wide = /\//.test(raw) && !it.labels && it.ids.length === 1;
    const cls = "row" + (it.sub ? " sub" : "") + (it.s ? " feature" : "") + (wide ? " wide" : "");
    return '<div class="' + cls + '" data-ids="' + it.ids.join(",") + '">' +
      '<div class="n">' + (it.s ? '<span class="star">&#9733;</span>' : '') + esc(it.n) + '</div>' +
      '<div class="p">' + (hideIfEqual && raw === hideIfEqual ? '' : p) + '</div>' +
      (it.d ? '<div class="d">' + esc(it.d) + '</div>' : '') +
      '</div>';
  }
  function secHtml(sec) {
    const sizeStr = sec.sizes ? (prices[sec.sizes] || "") : "";
    let sizesBar = "";
    if (sizeStr) {
      sizesBar = '<div class="sizes">' + sizeStr.split("/").map(part => {
        const m = part.trim().match(/^([A-Za-z]+)\s+(.*)$/);
        const label = m ? ({ S: "Small", M: "Medium", L: "Large" }[m[1]] || m[1]) : "";
        return '<span>' + (m ? '<em>' + esc(label) + '</em>' + money(m[2]) : money(part)) + '</span>';
      }).join("") + '</div>';
    }
    return '<section class="sec' + (sec.grow ? ' grow' : '') + (sec.big ? ' big' : '') + '">' +
      '<h2>' + esc(sec.h) + '</h2>' +
      (sec.by ? '<div class="by">' + esc(sec.by) + '</div>' : '') +
      (sec.meta ? '<div class="meta">' + esc(sec.meta) + '</div>' : '') +
      sizesBar +
      (sec.inline
        ? '<div class="flavors">' + sec.items.map(it => {
            const own = it.ids.map(id => prices[id]).join("|");
            return '<span>' + esc(it.n) + (own && own !== sizeStr ? ' ' + priceHtml(it) : '') + '</span>';
          }).join('') + '</div>'
        : '<div class="list' + (sec.two ? ' two' : '') + '">' + sec.items.map(it => rowHtml(it, sizeStr)).join("") + '</div>') +
      '</section>';
  }

  /* ---------- hero ---------- */
  function cardHtml(k, title, small, priceStr) {
    return '<div class="card"><div class="k">' + esc(k) + '</div>' +
      '<div class="t">' + esc(title) + (small ? '<small>' + esc(small) + '</small>' : '') + '</div>' +
      '<div class="pr">' + (priceStr ? money(priceStr) : '') + '</div></div>';
  }
  function heroHtml(B) {
    const h = B.hero;
    let pic = "", over = "", cards = "";
    if (h.soup) {
      const list = (settings.soupList && settings.soupList.length)
        ? settings.soupList
        : (settings.soup ? [{ name: settings.soup, image: settings.soupImage || "" }] : []);
      const withPhotos = list.filter(s => s.image);
      if (withPhotos.length >= 2) {
        pic = '<div class="pic split">' + withPhotos.slice(0, 2).map(s =>
          '<div><i style="background-image:url(\'' + esc(s.image) + '\')"></i></div>').join("") + '</div>';
      } else {
        const img = withPhotos.length ? withPhotos[0].image : PHOTO + h.fallbackPhoto + ".webp";
        pic = '<div class="pic"><i style="background-image:url(\'' + esc(img) + '\')"></i></div>';
      }
      if (list.length) {
        over = '<div class="eyebrow">' + (list.length > 1 ? "Soups of the Day" : "Soup of the Day") + '</div>' +
          '<h1>' + list.map(s => esc(s.name)).join(" &amp; ") + '</h1>' +
          '<div class="heroPrice"><div class="p">' + money(prices.R099 || "") + '</div><div class="note">Homemade, every day. Ask for a bowl with any order.</div></div>';
      } else {
        over = '<div class="eyebrow">Proudly Featuring</div><h1>Boar’s Head Hoagies</h1>' +
          '<div class="heroPrice"><div class="note" style="max-width:none">Premium deli meats &amp; cheeses, sliced fresh.</div></div>';
      }
      cards = B.side.map(secHtml).join("");
      return '<div class="hero">' + pic + '<img class="logo" src="' + LOGO_URL + '" alt="Rocco’s Pizza">' +
        '<div class="heroOver" style="position:absolute;left:48px;right:40px;bottom:var(--cardsH,0px);z-index:2;padding-bottom:28px">' + over + '</div>' +
        '<div class="cards side">' + cards + '</div></div>';
    }
    pic = '<div class="pic"><i style="background-image:url(\'' + PHOTO + h.photo + '.webp\')"></i></div>';
    over = '<div class="eyebrow">' + esc(h.eyebrow) + '</div><h1>' + esc(h.title) + '</h1>' +
      '<div class="heroPrice"><div class="p">' + money(prices[h.id] || "") + '</div><div class="note">' + esc(h.note) + '</div></div>';
    // Today's special cards
    const day = weekday();
    (DAILY[day] || []).forEach(id => { cards += cardHtml("Today", SHORT[id][0], SHORT[id][1], prices[id]); });
    if (!cards) cards = cardHtml("Gluten free", "10″ Gluten Free Pizza", "All pasta dishes available gluten free", prices.R017);
    if (h.section) cards += secHtml(h.section);
    return '<div class="hero">' + pic + '<img class="logo" src="' + LOGO_URL + '" alt="Rocco’s Pizza">' +
      '<div class="heroOver" style="position:absolute;left:48px;right:40px;bottom:var(--cardsH,0px);z-index:2;padding-bottom:26px">' + over + '</div>' +
      '<div class="cards">' + cards + '</div></div>';
  }

  /* ---------- footer ---------- */
  function footHtml() {
    let tag = "", parts = [];
    if (tv === 1) {
      if (weekday() <= 4) {
        tag = "Pickup Deals · Mon–Thu";
        parts = PICKUP_DEALS.map(id => esc(SHORT[id][0]) + '<b>' + money(prices[id] || "") + '</b>');
        parts.push("Toppings extra");
      } else {
        tag = "Catering";
        parts = ["Chef Lucas caters parties, offices & events", "Call to plan your order"];
      }
    } else {
      if (settings.banner) { tag = "Today"; parts.push('<span class="alert">' + esc(settings.banner) + '</span>'); }
      else { tag = "Fresh Daily"; parts = ["Boar’s Head meats & cheeses", "Homemade sauces", "Locally sourced"]; }
    }
    return '<div class="tag">' + esc(tag) + '</div>' +
      '<div class="run"><span class="inner">' + parts.join('<i>&bull;</i>') + '</span></div>' +
      '<div class="brand"><b>' + PHONE + '</b><span></span>' + WEB + '</div>';
  }

  /* ---------- draw ---------- */
  function draw() {
    const B = BOARDS[tv];
    const stage = document.getElementById("stage");
    stage.innerHTML =
      '<div class="main" style="grid-template-columns:' + B.cols + '">' +
        heroHtml(B) +
        B.cols_.map(c => '<div class="col">' + c.map(secHtml).join("") + '</div>').join("") +
      '</div>' +
      '<div class="foot">' + footHtml() + '</div>';
    layoutHero();
    fit();
    ticker();
  }

  /* Hero text sits right above the cards under the photo. */
  function layoutHero() {
    const hero = document.querySelector(".hero");
    const cards = hero && hero.querySelector(".cards");
    if (cards) hero.style.setProperty("--cardsH", cards.offsetHeight + "px");
  }

  /* One text size per board: shrink everything together until nothing overflows. */
  function fit() {
    const stage = document.getElementById("stage");
    const over = () => [...document.querySelectorAll(".col, .hero .cards")].some(c => c.scrollHeight > c.clientHeight + 1) ||
      [...document.querySelectorAll(".row")].some(r => r.scrollWidth > r.clientWidth + 1);
    let fs = 1;
    stage.classList.add("fitting");
    stage.style.setProperty("--fs", fs);
    layoutHero();
    while (over() && fs > 0.6) {
      fs = Math.round((fs - 0.02) * 100) / 100;
      stage.style.setProperty("--fs", fs);
      layoutHero();
    }
    stage.classList.remove("fitting");
    layoutHero();
    stage.dataset.fs = fs;
  }

  function ticker() {
    const run = document.querySelector(".foot .run");
    const inner = run && run.querySelector(".inner");
    if (!inner) return;
    run.classList.remove("scroll");
    if (inner.scrollWidth > run.clientWidth) {
      run.classList.add("scroll");
      run.style.setProperty("--dur", Math.max(18, inner.scrollWidth / 80) + "s");
    }
  }

  /* ---------- scale + anti burn-in ---------- */
  function scale() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById("stage").style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  let drift = 0;
  function nudge() {
    const offs = [[0,0],[3,2],[-3,2],[3,-2],[-3,-2],[0,3]];
    drift = (drift + 1) % offs.length;
    const st = document.getElementById("stage");
    st.style.marginLeft = offs[drift][0] + "px";
    st.style.marginTop = offs[drift][1] + "px";
  }

  /* ---------- feed ---------- */
  function apply(feed) {
    if (!feed || !Array.isArray(feed.items)) return false;
    const next = Object.assign({}, FALLBACK);
    feed.items.forEach(it => { if (it && it.id && it.price) next[it.id] = String(it.price).trim(); });
    const changed = lastPrices ? Object.keys(next).filter(id => next[id] !== lastPrices[id]) : [];
    prices = next; lastPrices = next;
    settings = Object.assign({ soup: "", banner: "", soupList: [] }, feed.settings || {});
    draw();
    changed.forEach(id => document.querySelectorAll('.row[data-ids*="' + id + '"]').forEach(el => el.classList.add("glow")));
    return true;
  }
  function load() {
    fetch(FEED_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(feed => { if (apply(feed)) { try { localStorage.setItem(STORE_KEY, JSON.stringify(feed)); } catch (e) {} } })
      .catch(() => { /* keep the last good prices */ });
  }

  function boot() {
    scale();
    window.addEventListener("resize", scale);
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
    if (!stored || !apply(stored)) draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); ticker(); });
    load();
    setInterval(load, REFRESH_MS);
    setInterval(nudge, 10 * 60 * 1000);
    setInterval(() => {
      const h = Number(new Date().toLocaleString("en-US", { timeZone: TZ, hour: "numeric", hour12: false }));
      if (h === 4 && performance.now() > 2 * 3600 * 1000) location.reload();
      else draw(); // today's special changes at midnight
    }, 30 * 60 * 1000);
  }
  boot();
})();
</script>
</body>
