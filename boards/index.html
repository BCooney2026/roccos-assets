<title>Rocco's Pizza Menu Board</title>
<!--
  ROCCO'S MENU BOARDS (two 50" TVs at the shop)
  ------------------------------------------------------------------
  One file, two boards:
    ?tv=1   Pizza board: Classic, Specialty, Chef Lucas, Italian Dinners
    ?tv=2   Sandwich board: logo, Seafood, Sides, Kids, Strombolis,
            Salads, Appetizers, Hot Steaks & Subs, Burgers, Hoagies

  PRICES: every item points at its Sheet ID (R001 to R148) and pulls
  the price from the command center feed, the same one the website
  reads. George changes a price on the tablet and the TVs follow
  within a few minutes. Typed prices below are only the fallback for
  the very first load with no internet.

  The page:
    - draws on a fixed 1920x1080 stage, scaled to fit any TV
    - refreshes the feed every 2 minutes, keeps the last good copy
      (localStorage) so a Wi-Fi blip never blanks the board
    - reloads itself at 4 am so code changes get picked up
    - shifts a few pixels every 10 minutes (no burn-in)
    - shrinks a panel's text if a long price would overflow it

  Bottom strip:
    tv=1  today's special (by weekday) + Mon-Thu pickup deals
    tv=2  soup(s) of the day + the Banner Message when George sets one

  To change what is on a board, edit BOARDS below. To change a
  price, use the tablet. Never type prices in here.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e9c46a;
    --gold-hi: #f8e3a0;
    --gold-lo: #9a7426;
    --price: #ffcf5a;
    --ember: #ff5a36;
    --red: #c62828;
    --text: #fbf7ef;
    --dim: rgba(251,247,239,.62);
    --panel: #121212;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; cursor: none; }

  /* 1920x1080 stage, scaled to the screen */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    color: var(--text);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    /* dark planks, like the old boards */
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(255,110,40,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 100%, rgba(198,40,40,.10), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 240px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 7px),
      linear-gradient(180deg, #1b1a19, #0d0c0c);
    padding: 22px 22px 0;
    display: flex; flex-direction: column; gap: 16px;
    transition: margin .8s ease;
  }

  .grid { flex: 1; min-height: 0; display: grid; gap: 16px; }

  /* Gold framed panel */
  .panel {
    position: relative; min-height: 0; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
      var(--panel);
    border: 3px solid var(--gold);
    border-image: linear-gradient(160deg, var(--gold-hi), var(--gold-lo) 35%, var(--gold) 60%, var(--gold-lo)) 1;
    box-shadow: inset 0 0 0 2px #000, inset 0 0 0 3px rgba(233,196,106,.35), 0 14px 30px rgba(0,0,0,.55);
    padding: 18px 22px 16px;
    display: flex; flex-direction: column;
    --fs: 1;
  }
  /* Photo header: George's real shoot photos (same files as the website
     menu banners), fading into the panel, heading over the bottom edge. */
  .panel.has-photo { padding-top: 0; }
  .photo {
    position: relative; margin: 0 -22px; height: var(--ph, 150px); flex: none; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent);
            mask-image: linear-gradient(180deg, #000 55%, transparent);
  }
  .photo i {
    position: absolute; inset: 0; background-size: cover; background-position: center 45%;
    animation: kenburns 40s ease-in-out infinite alternate; filter: saturate(1.08) contrast(1.04);
  }
  @keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.12) translateY(-2%); } }
  .has-photo h2 { position: relative; margin-top: -58px; text-shadow: 0 3px 14px rgba(0,0,0,.95), 0 0 2px #000; }

  .panel h2 {
    font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: calc(46px * var(--hs, 1)); line-height: 1.02; letter-spacing: .02em;
    text-align: center; color: var(--text);
  }
  .panel h2::after {
    content: ""; display: block; height: 3px; width: 70%; margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .panel .sub {
    text-align: center; color: var(--gold-hi); font-family: "Caveat", cursive;
    font-size: calc(30px * var(--fs)); line-height: 1.05; margin-top: 6px;
  }
  .panel .note {
    text-align: center; color: var(--dim); font-family: "Barlow", sans-serif;
    font-size: calc(17px * var(--fs)); line-height: 1.25; margin-top: 4px;
  }
  .panel .sizebar {
    display: flex; justify-content: center; gap: 18px; margin-top: 8px;
    font-family: "Oswald", sans-serif; font-weight: 600; color: var(--price);
    font-size: calc(24px * var(--fs));
  }
  .panel .sizebar span em { font-style: normal; color: var(--dim); font-weight: 500; margin-right: 6px; }

  .items { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; margin-top: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: baseline; }
  .item .name {
    font-weight: 700; font-size: calc(33px * var(--fs)); line-height: 1.08; color: var(--text);
    display: flex; align-items: baseline; gap: 8px;
  }
  .item .name .star { color: var(--gold); font-size: .8em; }
  .item .dots { display: none; }
  .item .price {
    font-family: "Oswald", sans-serif; font-weight: 600; color: var(--price);
    font-size: calc(30px * var(--fs)); line-height: 1; white-space: nowrap; text-align: right;
    text-shadow: 0 0 18px rgba(255,190,60,.25);
  }
  /* Multi-size prices ("Med $17.75 / Large $19.75") get their own line */
  .item .price.multi { grid-column: 1 / -1; text-align: left; font-size: calc(23px * var(--fs)); margin-top: 3px; }
  .item .desc {
    grid-column: 1 / -1; color: var(--dim); font-family: "Barlow", sans-serif; font-weight: 400;
    font-size: calc(18px * var(--fs)); line-height: 1.2; margin-top: 2px;
  }
  .item.flash .price { animation: flash 2.4s ease 3; }
  @keyframes flash { 0%,100% { color: var(--price); } 50% { color: #fff; text-shadow: 0 0 22px var(--ember); } }

  .item.small .name { font-size: calc(22px * var(--fs)); color: var(--dim); font-weight: 600; }
  .item.small .price { font-size: calc(22px * var(--fs)); }

  /* Compact rows (long lists) */
  .panel.compact .item .name { font-size: calc(29px * var(--fs)); }
  .panel.compact .item .price { font-size: calc(27px * var(--fs)); }

  /* Logo block (tv=2) */
  .brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 0; }
  .brand img { width: 400px; height: auto; margin: -58px 0 -70px; filter: drop-shadow(0 14px 30px rgba(0,0,0,.6)); }
  .brand .tag {
    font-family: "Caveat", cursive; font-weight: 700; color: var(--text); text-align: center;
    font-size: 31px; line-height: 1.12;
  }
  .brand .bh { display: flex; align-items: center; gap: 10px; margin-top: 2px; color: var(--gold-hi);
    font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 16px; }

  /* Bottom strip: today's specials / soup / banner */
  .strip {
    height: 78px; margin: 0 -22px; display: flex; align-items: center; gap: 26px;
    padding: 0 30px; overflow: hidden; white-space: nowrap;
    background: linear-gradient(90deg, #7f1414, var(--red) 30%, #9b1b1b 70%, #5c0f0f);
    border-top: 3px solid var(--gold);
    box-shadow: 0 -10px 30px rgba(0,0,0,.5);
  }
  .strip .tag {
    flex: none; font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; font-size: 22px; color: #1a0b05; background: var(--gold);
    padding: 8px 14px; border-radius: 6px;
  }
  .strip .run { flex: 1; min-width: 0; overflow: hidden; font-weight: 700; font-size: 34px; color: #fff; }
  .strip .run b { font-family: "Oswald", sans-serif; font-weight: 600; color: var(--gold-hi); margin-left: 8px; }
  .strip .run i { font-style: normal; color: rgba(255,255,255,.55); margin: 0 18px; }
  .strip .run .inner { display: inline-block; }
  .strip .run.scroll .inner { animation: ticker var(--dur, 30s) linear infinite; padding-left: 100%; }
  @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  .strip .alert { color: #fff; background: rgba(0,0,0,.28); padding: 4px 14px; border-radius: 6px; }
</style>

          { n: "Sausage or Meatball Sandwich", ids: ["R054", "R051"] },
          { n: "Sausage Parmigiana Sub", ids: ["R055"] },
          { n: "Sausage & Pepper w/ Cheese", ids: ["R056"] },
          { n: "Hot Roast Beef", ids: ["R057"] }
        ]},
        burgers: { h: "Burgers", items: [
          { n: "Hamburger", ids: ["R102"] },
          { n: "Cheeseburger", ids: ["R103"] },
          { n: "Pizza Burger", ids: ["R104"] },
          { n: "California Cheeseburger", ids: ["R105"] },
          { n: "Hawaiian Cheeseburger", ids: ["R107"] },
          { n: "Texas Burger", ids: ["R106"], d: "Cheddar, bacon, BBQ sauce & an onion ring on brioche" }
        ]},
        hoagies: { h: "Hoagies & Sandwiches", sub: "Proudly featuring Boar's Head", compact: 1, items: [
          { n: "Turkey Hoagie", ids: ["R072"] },
          { n: "Turkey Club Sandwich", ids: ["R073"], s: 1 },
          { n: "Italian Hoagie", ids: ["R069"] },
          { n: "Roast Beef Hoagie", ids: ["R068"] },
          { n: "American Hoagie", ids: ["R070"] },
          { n: "Ham & Cheese", ids: ["R075"] },
          { n: "Mixed Cheese", ids: ["R074"] },
          { n: "Salami & Provolone", ids: ["R076"] },
          { n: "Capicola & Provolone", ids: ["R077"] },
          { n: "Chicken Caesar Salad Hoagie", ids: ["R067"] },
          { n: "Tuna Fish Hoagie", ids: ["R071"] },
          { n: "Turkey Panini", ids: ["R108"], d: "Lettuce, tomato, provolone & roasted red peppers" },
          { n: "Grilled Chicken Sandwich", ids: ["R065"], d: "Fresh mozzarella, lettuce, bruschetta & frizzled onions on brioche" },
          { n: "Add: cheese, mushrooms, hot & sweet peppers, bacon", ids: ["R078"], small: 1 }
        ]}
      }
    }
  };

  /* ---------- state ---------- */
  const tv = String(new URLSearchParams(location.search).get("tv") || "1") === "2" ? 2 : 1;
  let prices = Object.assign({}, FALLBACK);
  let settings = { soup: "", banner: "", soupList: [] };
  let lastPrices = null;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function pretty(p) { return esc(p).replace(/\s*\/\s*/g, " &middot; "); }
  function priceFor(ids) {
    const list = ids.map(id => prices[id]).filter(Boolean);
    if (!list.length) return "";
    const same = list.every(p => p === list[0]);
    return same ? list[0] : list.join(" / ");
  }
  function weekday() { // 1 = Monday ... 7 = Sunday, in the shop's time zone
    const d = new Date().toLocaleDateString("en-US", { timeZone: TZ, weekday: "short" });
    return { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[d] || 1;
  }

  /* ---------- drawing ---------- */
  function itemHtml(it, sizePrice) {
    const p = it.np ? "" : priceFor(it.ids);
    const hide = sizePrice && p === sizePrice; // Strombolis: price shown once in the size bar
    const multi = /\//.test(p) || p.length > 9;
    // Multi-size price: name, then the size prices, then the small print.
    return '<div class="item' + (it.small ? ' small' : '') + '" data-ids="' + it.ids.join(",") + '">' +
      '<div class="name">' + (it.s ? '<span class="star">&#9733;</span>' : '') + esc(it.n) + '</div>' +
      '<div class="price' + (multi ? ' multi' : '') + '">' + (hide ? '' : pretty(p)) + '</div>' +
      (it.d ? '<div class="desc">' + esc(it.d) + '</div>' : '') +
      '</div>';
  }

  function panelHtml(pn, key) {
    if (key === "brand") {
      return '<div class="panel brand" style="border:none;background:none;box-shadow:none">' +
        '<img src="' + LOGO_URL + '" alt="Rocco’s Pizza">' +
        '<div class="tag">Makers of artisan pizza<br>Buying locally sourced products<br>Homemade &amp; fresh ingredients</div>' +
        '</div>';
    }
    let sizeBar = "", sizePrice = "";
    if (pn.sizes) {
      sizePrice = prices[pn.sizes] || "";
      const parts = sizePrice.split("/").map(x => x.trim()).filter(Boolean);
      sizeBar = '<div class="sizebar">' + parts.map(x => {
        const m = x.match(/^(\S+)\s+(.*)$/);
        const label = m ? ({ S: "Small", M: "Medium", L: "Large" }[m[1]] || m[1]) : "";
        return '<span>' + (m ? '<em>' + esc(label) + '</em>' + esc(m[2]) : esc(x)) + '</span>';
      }).join("") + '</div>';
    }
    const cls = "panel" + (pn.compact ? " compact" : "");
    const itemsStyle = pn.grid2 ? ' style="display:grid;grid-template-columns:1fr 1fr;column-gap:26px;align-content:space-evenly"' : '';
    const photo = pn.img
      ? '<div class="photo" style="--ph:' + (BOARDS[tv].photoH || 150) + 'px"><i style="background-image:url(\'' + PHOTO_BASE + pn.img + '.webp\')"></i></div>'
      : '';
    return '<div class="' + cls + (pn.img ? ' has-photo' : '') + '"' + (pn.tight ? ' style="--hs:.78"' : '') + '>' +
      photo +
      '<h2>' + esc(pn.h) + '</h2>' +
      (pn.sub ? '<div class="sub">' + esc(pn.sub) + '</div>' : '') +
      (pn.note ? '<div class="note">' + esc(pn.note) + '</div>' : '') +
      sizeBar +
      '<div class="items"' + itemsStyle + '>' + pn.items.map(it => itemHtml(it, sizePrice)).join("") + '</div>' +
      '</div>';
  }

  function stripHtml() {
    const B = BOARDS[tv];
    let tag = "", parts = [];
    if (B.strip === "specials") {
      const day = weekday();
      const todays = (DAILY[day] || []).map(id => esc(SHORT[id]) + '<b>' + esc(prices[id] || "") + '</b>');
      if (todays.length) { tag = "Today's Special"; parts = parts.concat(todays); }
      if (day <= 4) {
        if (!tag) tag = "Pickup Deals";
        parts.push('Pickup Mon–Thu: ' + PICKUP_DEALS.map(id => esc(SHORT[id]) + '<b>' + esc(prices[id] || "") + '</b>').join('<i>&bull;</i>'));
      }
      if (!parts.length) {
        tag = "Gluten Free";
        parts.push('10" Gluten Free Pizza<b>' + esc(prices.R017 || "") + '</b>');
        parts.push('All pasta dishes available gluten free');
      }
    } else {
      const soups = (settings.soupList && settings.soupList.length)
        ? settings.soupList.map(s => s.name)
        : (settings.soup ? [settings.soup] : []);
      if (soups.length) {
        tag = soups.length > 1 ? "Soups of the Day" : "Soup of the Day";
        parts.push(soups.map(esc).join(' &amp; ') + '<b>' + esc(prices.R099 || "") + '</b>');
      }
      if (settings.banner) {
        if (!tag) tag = "Today";
        parts.push('<span class="alert">' + esc(settings.banner) + '</span>');
      }
      if (!parts.length) {
        tag = "Boar's Head";
        parts.push("Proudly serving Boar's Head meats &amp; cheeses");
      }
    }
    return '<div class="tag">' + esc(tag) + '</div><div class="run"><span class="inner">' + parts.join('<i>&bull;</i>') + '</span></div>';
  }

  function draw() {
    const B = BOARDS[tv];
    const stage = document.getElementById("stage");
    let grid;
    if (tv === 1) {
      grid = '<div class="grid" style="grid-template-columns:' + B.cols + '">' +
        B.panels.map(p => panelHtml(p)).join("") + '</div>';
    } else {
      grid = '<div class="grid" style="grid-template-columns:' + B.cols + '">' +
        B.layout.map(c => '<div style="display:grid;gap:16px;min-height:0;grid-template-rows:' + c.rows + '">' +
          c.panels.map(k => panelHtml(B.panels[k], k)).join("") + '</div>').join("") +
        '</div>';
    }
    stage.innerHTML = grid + '<div class="strip">' + stripHtml() + '</div>';
    fitAll();
    tickerIfNeeded();
  }

  /* Shrink text if anything overflows (long multi-size prices), then
     use the same size on every panel of the board. */
  function fitAll() {
    document.querySelectorAll(".panel:not(.brand)").forEach(panel => {
      let fs = 1;
      panel.style.setProperty("--fs", fs);
      const items = panel.querySelector(".items");
      const over = () => panel.scrollHeight > panel.clientHeight + 1 ||
        (items && items.scrollHeight > items.clientHeight + 1) ||
        [...panel.querySelectorAll(".item")].some(i => i.scrollWidth > i.clientWidth + 1);
      while (over() && fs > 0.6) {
        fs = Math.round((fs - 0.04) * 100) / 100;
        panel.style.setProperty("--fs", fs);
      }
      panel.dataset.fs = fs;
    });
    // One text size per board: every panel matches the tightest one,
    // so nothing looks randomly bigger or smaller than its neighbor.
    const all = [...document.querySelectorAll(".panel:not(.brand)")];
    const min = Math.min.apply(null, all.map(p => Number(p.dataset.fs || 1)));
    all.forEach(p => p.style.setProperty("--fs", min));
  }

  /* The strip scrolls only when the text is wider than the screen. */
  function tickerIfNeeded() {
    const run = document.querySelector(".strip .run");
    const inner = run && run.querySelector(".inner");
    if (!inner) return;
    run.classList.remove("scroll");
    if (inner.scrollWidth > run.clientWidth) {
      run.classList.add("scroll");
      run.style.setProperty("--dur", Math.max(18, inner.scrollWidth / 90) + "s");
    }
  }

  /* ---------- scale + anti burn-in ---------- */
  function scale() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    const st = document.getElementById("stage");
    st.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  let drift = 0;
  function nudge() {
    const offs = [[0,0],[3,2],[-3,2],[3,-2],[-3,-2],[0,3]];
    drift = (drift + 1) % offs.length;
    const st = document.getElementById("stage");
    st.style.marginLeft = offs[drift][0] + "px";
    st.style.marginTop = offs[drift][1] + "px";
  }

  /* ---------- feed ---------- */
  function apply(feed) {
    if (!feed || !Array.isArray(feed.items)) return false;
    const next = Object.assign({}, FALLBACK);
    feed.items.forEach(it => { if (it && it.id && it.price) next[it.id] = String(it.price).trim(); });
    const changed = lastPrices ? Object.keys(next).filter(id => next[id] !== lastPrices[id]) : [];
    prices = next;
    lastPrices = next;
    settings = Object.assign({ soup: "", banner: "", soupList: [] }, feed.settings || {});
    draw();
    // Flash anything that just changed so it catches the eye.
    changed.forEach(id => document.querySelectorAll('.item[data-ids*="' + id + '"]').forEach(el => el.classList.add("flash")));
    return true;
  }

  function load() {
    fetch(FEED_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(feed => {
        if (apply(feed)) { try { localStorage.setItem(STORE_KEY, JSON.stringify(feed)); } catch (e) {} }
      })
      .catch(() => { /* keep showing the last good prices */ });
  }

  function boot() {
    scale();
    window.addEventListener("resize", () => { scale(); });
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
    if (!stored || !apply(stored)) draw();
    // Fonts change text widths: refit once they land.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitAll(); tickerIfNeeded(); });
    load();
    setInterval(load, REFRESH_MS);
    setInterval(nudge, 10 * 60 * 1000);
    // Midnight-ish redraw (today's special changes) and a 4 am reload for code updates.
    setInterval(() => {
      const h = Number(new Date().toLocaleString("en-US", { timeZone: TZ, hour: "numeric", hour12: false }));
      if (h === 4 && performance.now() > 2 * 3600 * 1000) location.reload();
      else draw();
    }, 30 * 60 * 1000);
  }

  boot();
})();
</script>
