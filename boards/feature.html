<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocco's Pizza: Feature Board</title>
<!--
  BOARD 4: THE FEATURE BOARD (weekly specials + promotions)
  Cycles through promotion "templates" like a short food commercial:
    oven   - "The Rocco's Oven Glow" signature moment (logo reveal)
    weekly - This week / today at Rocco's (the actual special)
    deal   - multi-price deal (Mon-Thu pickup pizzas)
    spot   - one hero item with a headline (Pizza Spotlight, etc.)
    duo    - two dishes side by side (Italian Kitchen, Catering)
  Each promotion is a plain record in PROMOS below, shaped like the
  future "Specials" tab in George's command center: name, description,
  price (by Sheet ID, never typed), photo, days, start/end, active,
  priority. A promo only shows when it is active, scheduled for today,
  and complete (no price shown if the Sheet has none).
  Photos: real Rocco's dishes only (cut out from George's shoot).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Playfair+Display:ital,wght@1,800;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signage.css">
<style>
  .slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility 0s linear .8s; }
  .slide.on { opacity: 1; visibility: visible; transition: opacity .8s ease; }

  .slide .glow { left: 860px; top: 120px; width: 1120px; height: 900px; opacity: 0; }
  .slide.on .glow { animation: glowIn 2.2s ease .1s forwards, breathe 9s ease-in-out 2.3s infinite; }
  @keyframes glowIn { from { opacity: 0; transform: scale(.75); } to { opacity: 1; transform: scale(1); } }

  /* Copy column */
  .copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 820px; display: flex; flex-direction: column; justify-content: center; z-index: 3; }
  .copy .eyebrow { font-size: 24px; opacity: 0; }
  .slide.on .copy .eyebrow { animation: fadeUp .8s ease .25s forwards; }
  .headline { position: relative; margin-top: 22px; }
  .headline .line { display: block; overflow: hidden; padding: 0 0 .08em; }
  .headline .line > span { display: inline-block; transform: translateY(110%); }
  .slide.on .headline .line > span { animation: rise 1s cubic-bezier(.16,1,.3,1) forwards; }
  .slide.on .headline .line:nth-child(2) > span { animation-delay: .14s; }
  .slide.on .headline .line:nth-child(3) > span { animation-delay: .28s; }
  .headline .feature-title { font-size: 112px; text-shadow: none; }
  /* Each line rises out of its own mask; padding keeps the italics from clipping */
  .headline .line { white-space: nowrap; padding: 0 40px .12em; margin: 0 -40px; }
  /* Warm streak of light that passes behind the headline once */
  .streak {
    position: absolute; left: -60px; top: 42%; width: 520px; height: 120px; pointer-events: none; z-index: -1;
    background: radial-gradient(closest-side, rgba(255,185,100,.55), rgba(255,140,60,.18) 50%, transparent);
    filter: blur(16px); opacity: 0;
  }
  .slide.on .streak { animation: sweep 2.2s cubic-bezier(.4,0,.2,1) .55s forwards; }
  @keyframes sweep { 0% { opacity: 0; transform: translateX(-30%); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateX(140%); } }

  .item { margin-top: 38px; opacity: 0; }
  .slide.on .item { animation: fadeUp .9s ease .75s forwards; }
  .item .name { font-weight: 800; font-size: 46px; letter-spacing: -.02em; line-height: 1.05; }
  .item .desc { margin-top: 10px; font-size: 26px; font-weight: 500; color: var(--ivory-2); max-width: 680px; line-height: 1.3; }
  .pricebig { display: flex; align-items: baseline; gap: 22px; margin-top: 26px; opacity: 0; transform-origin: left center; }
  .slide.on .pricebig { animation: pop .9s cubic-bezier(.3,1.5,.4,1) 1.15s forwards; }
  .pricebig .price { font-size: 120px; color: var(--tomato); line-height: .9; text-shadow: 0 10px 40px rgba(217,58,43,.35); }
  .pricebig .note { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass-hi); }
  .cta { margin-top: 34px; display: inline-flex; align-items: center; gap: 18px; opacity: 0; }
  .slide.on .cta { animation: fadeUp .8s ease 1.2s forwards; }
  .cta .k { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .24em; text-transform: uppercase; background: var(--tomato); color: #fff; padding: 10px 16px 9px; }
  .cta b { font-size: 46px; font-weight: 800; letter-spacing: -.01em; }

  /* Food */
  .slide .food { opacity: 0; z-index: 2; }
  .slide.on .food { animation: foodIn 1.5s cubic-bezier(.16,1,.3,1) .15s forwards; }
  .slide.on .food .inner { animation: push 16s ease-in-out 1.6s infinite alternate; }
  .food .inner { will-change: transform; }
  @keyframes foodIn { from { opacity: 0; transform: translateX(90px) scale(.92); } to { opacity: 1; transform: none; } }
  .slide.on .food.f2 { animation-delay: .45s; }
  .slide.on .food.f3 { animation-delay: .7s; }

  /* Deal cards (multi-price) */
  .deals { display: flex; gap: 22px; margin-top: 40px; opacity: 0; }
  .slide.on .deals { animation: fadeUp .9s ease .8s forwards; }
  .deal { padding: 22px 26px 20px; min-width: 230px; background: rgba(244,236,221,.05); border-top: 3px solid var(--tomato); }
  .deal .n { font-weight: 700; font-size: 28px; line-height: 1.1; }
  .deal .price { font-size: 64px; color: var(--ivory); margin-top: 12px; display: block; }
  .deal-note { margin-top: 24px; font-size: 24px; color: var(--ivory-2); font-weight: 500; opacity: 0; }
  .slide.on .deal-note { animation: fadeUp .8s ease 1.1s forwards; }

  /* Text-only special (no real photo yet) */
  .cards2 { display: flex; gap: 26px; margin-top: 44px; }
  .card2 { flex: 1; padding: 30px 32px; background: rgba(244,236,221,.05); border-left: 4px solid var(--tomato); opacity: 0; }
  .slide.on .card2 { animation: fadeUp .9s ease .8s forwards; }
  .slide.on .card2:nth-child(2) { animation-delay: 1s; }
  .card2 .n { font-weight: 800; font-size: 44px; letter-spacing: -.02em; line-height: 1.05; }
  .card2 .d { font-size: 24px; color: var(--ivory-2); margin-top: 8px; font-weight: 500; }
  .card2 .price { display: block; font-size: 96px; color: var(--tomato); margin-top: 18px; line-height: .9; }

  /* Signature: The Rocco's Oven Glow */
  .oven .glow { left: 410px; top: 90px; width: 1100px; height: 900px; }
  .oven .food { left: 560px; top: 250px; width: 800px; }
  .slide.oven.on .food { animation: ovenFood 2.6s ease .2s forwards; }
  .slide.oven.on .food .inner { animation: push 16s ease-in-out 2.8s infinite alternate; }
  @keyframes ovenFood { 0% { opacity: 0; filter: brightness(.15); transform: scale(.96); } 60% { opacity: 1; } 100% { opacity: 1; filter: brightness(.55); transform: scale(1); } }
  .oven .mark { position: absolute; left: 0; right: 0; top: 330px; text-align: center; z-index: 4; }
  .oven .mark .logo { position: relative; display: inline-block; width: 560px; opacity: 0; }
  .slide.oven.on .mark .logo { animation: logoIn 1.4s cubic-bezier(.16,1,.3,1) 1.4s forwards; }
  @keyframes logoIn { from { opacity: 0; transform: scale(.94); filter: blur(6px) drop-shadow(0 10px 22px rgba(0,0,0,.55)); } to { opacity: 1; transform: none; filter: drop-shadow(0 18px 40px rgba(0,0,0,.7)); } }
  /* Metallic highlight that runs across the logo once */
  .oven .mark .logo::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,240,200,.75) 50%, transparent 65%);
    background-size: 250% 100%; mix-blend-mode: overlay;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
  }
  .slide.oven.on .mark .logo::after { animation: sheen 1.6s ease 2.6s forwards; }
  @keyframes sheen { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -30% 0; } }
  .oven .tagline {
    margin-top: 6px; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: .5em; text-transform: uppercase;
    color: var(--brass-hi); opacity: 0;
  }
  .slide.oven.on .tagline { animation: track 1.6s ease 2.4s forwards; }
  @keyframes track { from { opacity: 0; letter-spacing: .9em; } to { opacity: 1; letter-spacing: .5em; } }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes rise { to { transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.7); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: none; } }

  /* Persistent frame: logo + phone */
  .frame { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; z-index: 6; display: flex; align-items: center; padding: 0 70px 0 60px; pointer-events: none; }
  .frame .logo { position: relative; width: 200px; margin-top: -8px; }
  .frame .right { margin-left: auto; text-align: right; font-family: "Oswald", sans-serif; font-size: 18px; letter-spacing: .22em; text-transform: uppercase; color: var(--ivory-3); }
  .frame .right b { display: block; font-family: "Inter", sans-serif; font-size: 32px; letter-spacing: 0; font-weight: 800; color: var(--ivory); }
  .frame.hide { opacity: 0; transition: opacity .6s; }
  .frame { transition: opacity .6s; }
  .progress { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--tomato), var(--brass)); width: 0; z-index: 7; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="env"><div class="slate"></div><div class="grain"></div><div class="vignette"></div></div>
  <div id="slides"></div>
  <div class="frame" id="frame">
    <div class="logo"><img id="frameLogo" alt="Rocco's Pizza"></div>
    <div class="right">Pickup &amp; Delivery<b>610-935-2202</b></div>
  </div>
  <div class="progress" id="progress"></div>
</div>
<script src="signage.js"></script>
<script>
(function () {
  "use strict";
  const LOGO = "https://framerusercontent.com/images/r89APyBCVRfktBf6smnZj6qI.png?width=1536&height=1024";
  const SECONDS = 12;      // each promotion
  const OVEN_SECONDS = 7;  // signature moment

  /*
   * PROMOS: the promotion library. This is the shape the command
   * center "Specials" tab will hold, so George edits rows, not code.
   *   template  oven | weekly | deal | spot | duo
   *   days      1 = Mon ... 7 = Sun (empty = every day)
   *   start/end yyyy-mm-dd, optional
   *   priceId   Sheet ID; the price always comes from the Sheet
   *   active    false hides it; priority orders the loop (low first)
   */
  const PROMOS = [
    { template: "oven", tagline: "A Phoenixville Favorite", img: "img/pizza-cheese.webp", priority: 0, active: true },

    { template: "weekly", days: [1], eyebrow: "Monday Special", headline: ["This Week", "at Rocco’s"],
      name: "Large Plain Pizza", desc: "Every Monday.", priceId: "R001",
      img: "img/pizza-cheese.webp", priority: 10, active: true },
    { template: "weekly", days: [2], eyebrow: "Tuesday Specials", headline: ["Tuesday", "at Rocco’s"],
      cards: [{ name: "Cheesesteak", desc: "Tuesday only", priceId: "R002" },
              { name: "Spaghetti & Meatballs", desc: "With salad & garlic bread", priceId: "R003" }],
      priority: 10, active: true },
    { template: "weekly", days: [3], eyebrow: "Wednesday Special", headline: ["This Week", "at Rocco’s"],
      name: "Antipasto", desc: "With garlic bread. Every Wednesday.", priceId: "R004",
      img: "img/antipasto.webp", priority: 10, active: true },

    { template: "deal", days: [1, 2, 3, 4], eyebrow: "Pickup Deals · Mon–Thu", headline: ["Pizza Night,", "Sorted."],
      deals: [{ name: "2 Large Cheese", priceId: "R005" }, { name: "2 Jersey Shore", priceId: "R006" }, { name: "Tomato Pie", priceId: "R007" }],
      note: "Pickup only, Monday through Thursday. Toppings extra.",
      imgs: ["img/pizza-cheese.webp", "img/pizza-jersey-shore.webp"], priority: 20, active: true },

    { template: "spot", eyebrow: "Rocco’s Famous", headline: ["Fresh from", "the Oven."],
      name: "Jersey Shore Pizza", desc: "Sweet sauce & white cheddar on a thin crust.", priceId: "R018",
      img: "img/pizza-jersey-shore.webp", priority: 30, active: true },

    { template: "spot", eyebrow: "Steaks & Subs", headline: ["Phoenixville,", "Come Hungry."],
      name: "Chicken Cheesesteak", desc: "Chopped chicken & melted cheese on a fresh roll.", priceId: "R061",
      img: "img/chicken-cheesesteak.webp", wide: false, priority: 40, active: true },

    { template: "duo", eyebrow: "The Italian Kitchen", headline: ["More Than Just", "Great Pizza."],
      name: "Pasta, entrées & Chef Lucas specialties", desc: "Homemade sauces, baked pastas and Italian dinners.",
      label: { name: "Cheese Ravioli", priceId: "R132" },
      imgs: ["img/ravioli-tray.webp", "img/antipasto.webp"], priority: 50, active: true },

    { template: "duo", eyebrow: "Catering", headline: ["Let Rocco’s", "Handle the Food."],
      name: "Parties, gatherings & special occasions", desc: "Trays of pasta, hot entr\u00e9es, hoagies, salads and more.",
      cta: "Call Rocco’s",
      imgs: ["img/ravioli-tray.webp", "img/chicken-caesar-hoagie.webp", "img/antipasto.webp"], priority: 60, active: true }
  ];

  const esc = RS.esc, p = RS.p;

  /** Only active, scheduled, complete promos for today. */
  function todaysPromos() {
    const day = RS.weekday(), today = RS.today();
    return PROMOS.filter(pr => pr.active)
      .filter(pr => !pr.days || !pr.days.length || pr.days.indexOf(day) >= 0)
      .filter(pr => (!pr.start || today >= pr.start) && (!pr.end || today <= pr.end))
      .filter(pr => !pr.priceId || RS.price(pr.priceId))         // never show a promo without its price
      .filter(pr => !pr.deals || pr.deals.every(d => RS.price(d.priceId)))
      .filter(pr => !pr.cards || pr.cards.every(c => RS.price(c.priceId)))
      .sort((a, b) => a.priority - b.priority);
  }

  function headline(lines) {
    return '<div class="headline"><div class="streak"></div><div class="feature-title">' +
      lines.map(l => '<span class="line"><span>' + esc(l) + '</span></span>').join("") + '</div></div>';
  }
  function food(src, style, cls) {
    return '<div class="food ' + (cls || "") + '" style="' + style + '"><div class="inner"><img src="' + src + '" alt=""></div></div>';
  }

  function slideHtml(pr) {
    if (pr.template === "oven") {
      return '<div class="slide oven" data-sec="' + OVEN_SECONDS + '"><div class="glow"></div>' +
        food(pr.img, "") +
        '<div class="mark"><div class="logo" style="--logo:url(\'' + LOGO + '\')"><img src="' + LOGO + '" alt="Rocco’s Pizza"></div>' +
        '<div class="tagline">' + esc(pr.tagline) + '</div></div></div>';
    }
    let html = '<div class="slide" data-sec="' + SECONDS + '"><div class="glow"></div><div class="copy">' +
      '<div class="eyebrow">' + esc(pr.eyebrow) + '</div>' + headline(pr.headline);

    if (pr.template === "weekly" && pr.cards) {
      html += '<div class="cards2">' + pr.cards.map(c =>
        '<div class="card2"><div class="n">' + esc(c.name) + '</div><div class="d">' + esc(c.desc) + '</div><span class="price">' + p(c.priceId) + '</span></div>').join("") + '</div></div>';
      return html + '</div>';
    }
    if (pr.template === "deal") {
      html += '<div class="deals">' + pr.deals.map(d => '<div class="deal"><div class="n">' + esc(d.name) + '</div><span class="price">' + p(d.priceId) + '</span></div>').join("") + '</div>' +
        '<div class="deal-note">' + esc(pr.note) + '</div></div>' +
        food(pr.imgs[0], "left:1020px;top:330px;width:700px;") +
        food(pr.imgs[1], "left:1260px;top:150px;width:560px;", "f2");
      return html + '</div>';
    }
    html += '<div class="item"><div class="name">' + esc(pr.name) + '</div><div class="desc">' + esc(pr.desc) + '</div></div>';
    if (pr.priceId) html += '<div class="pricebig"><span class="price">' + p(pr.priceId) + '</span></div>';
    if (pr.label && RS.price(pr.label.priceId)) html += '<div class="pricebig"><span class="note">' + esc(pr.label.name) + '</span><span class="price" style="font-size:72px">' + p(pr.label.priceId) + '</span></div>';
    if (pr.cta) html += '<div class="cta"><span class="k">' + esc(pr.cta) + '</span><b>610-935-2202</b></div>';
    html += '</div>';

    if (pr.template === "weekly" || pr.template === "spot") {
      const isSandwich = /cheesesteak/.test(pr.img);
      html += isSandwich ? food(pr.img, "left:1000px;top:190px;width:820px;") : food(pr.img, "left:930px;top:200px;width:940px;");
    } else if (pr.template === "duo") {
      if (pr.imgs.length === 3) {
        html += food(pr.imgs[2], "left:1300px;top:120px;width:520px;", "f2") +
                food(pr.imgs[1], "left:1000px;top:640px;width:820px;", "f3") +
                food(pr.imgs[0], "left:960px;top:230px;width:560px;");
      } else {
        html += food(pr.imgs[1], "left:1320px;top:170px;width:520px;", "f2") +
                food(pr.imgs[0], "left:960px;top:330px;width:640px;");
      }
    }
    return html + '</div>';
  }

  /* Shrink a headline until its widest line fits the copy column. */
  function fitHeadline(slide) {
    const t = slide.querySelector(".headline .feature-title");
    const copy = slide.querySelector(".copy");
    if (!t || !copy) return;
    let size = 112;
    t.style.fontSize = size + "px";
    const widest = () => Math.max.apply(null, [...t.querySelectorAll(".line > span")].map(s => s.scrollWidth));
    while (widest() > copy.clientWidth && size > 64) { size -= 4; t.style.fontSize = size + "px"; }
  }

  let list = [], idx = -1, timer = null;
  function build() {
    list = todaysPromos();
    document.getElementById("slides").innerHTML = list.map(slideHtml).join("");
  }
  function show(i) {
    const slides = document.querySelectorAll("#slides .slide");
    if (!slides.length) return;
    slides.forEach(s => s.classList.remove("on"));
    idx = i % slides.length;
    const el = slides[idx];
    void el.offsetWidth; // restart the animations
    fitHeadline(el);
    el.classList.add("on");
    const sec = Number(el.dataset.sec || SECONDS);
    document.getElementById("frame").classList.toggle("hide", el.classList.contains("oven"));
    const bar = document.getElementById("progress");
    bar.style.transition = "none"; bar.style.width = "0";
    void bar.offsetWidth;
    bar.style.transition = "width " + sec + "s linear"; bar.style.width = "100%";
    clearTimeout(timer);
    timer = setTimeout(() => show(idx + 1), sec * 1000);
  }

  document.getElementById("frameLogo").src = LOGO;
  let started = false, lastKey = "";
  RS.start(function () {
    // Only rebuild when prices or settings actually changed, so a refresh
    // never restarts an animation for nothing.
    const key = JSON.stringify([RS.prices, RS.settings]);
    if (key === lastKey) return;
    lastKey = key;
    const keep = Math.max(0, idx);
    build();
    if (!started) { started = true; show(0); }
    else show(keep);
  });
  // A new day can change which specials run.
  setInterval(() => { build(); show(0); }, 60 * 60 * 1000);
})();
</script>
</body>
</html>
